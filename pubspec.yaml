name: reminder_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (BoM‑compatible versions)
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_ai: ^3.11.0

  # (optional – you can keep or remove later)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.4
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
